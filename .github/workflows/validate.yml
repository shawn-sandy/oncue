# Validate manifests and skills, and type-check and test the engine, on every pull request and push to main.
# The browser tests skip here (Playwright is installed without a browser); run them locally.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run validate
      - run: npm run engine:typecheck
      - run: npm run engine:test
